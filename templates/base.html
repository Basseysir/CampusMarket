<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMarket MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="{% url 'product_list' %}" class="text-xl font-bold tracking-wide">CampusMarket</a>
            <div class="space-x-4 flex items-center">
                {% if user.is_authenticated %}
                    <a href="{% url 'create_product' %}" class="bg-amber-500 hover:bg-amber-600 px-3 py-1.5 rounded-md font-medium text-sm">Sell Item</a>
                    <a href="{% url 'seller_dashboard' %}" class="hover:underline text-sm">Dashboard</a>
                    <a href="{% url 'logout' %}" class="text-sm opacity-80 hover:opacity-100">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-sm hover:underline">Login</a>
                    <a href="{% url 'register' %}" class="bg-white text-indigo-600 px-3 py-1.5 rounded-md font-medium text-sm">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-200 text-center py-4 text-xs text-gray-600">
        CampusMarket MVP &copy; 2026 - Student Buy & Sell Platform
    </footer>
</body>
</html>
