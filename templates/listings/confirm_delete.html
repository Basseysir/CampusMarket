{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-sm border mt-10 text-center">
    <h2 class="text-xl font-bold text-gray-900 mb-2">Remove Listing?</h2>
    <p class="text-sm text-gray-600 mb-6">Are you sure you want to delete <strong>"{{ product.title }}"</strong>? This action cannot be undone.</p>

    <form method="POST" class="flex gap-4 justify-center">
        {% csrf_token %}
        <a href="{% url 'seller_dashboard' %}" class="px-4 py-2 border rounded-md text-sm font-medium text-gray-600 hover:bg-gray-50">Cancel</a>
        <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded-md text-sm font-medium hover:bg-red-700">Delete Permanently</button>
    </form>
</div>
{% endblock %}
