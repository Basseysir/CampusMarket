{% extends 'base.html' %}
{% block content %}
<div class="mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
    <form method="GET" class="w-full md:w-2/3 flex gap-2">
        <input type="text" name="q" value="{{ query }}" placeholder="Search products..." class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md font-medium">Search</button>
    </form>
    
    <div class="w-full md:w-1/3">
        <form method="GET">
            <select name="category" onchange="this.form.submit()" class="w-full p-2 border rounded-md">
                <option value="">All Categories</option>
                {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if cat.id|stringformat:"i" == selected_category %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </form>
    </div>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    {% for product in products %}
    <div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition">
        <img src="{{ product.image.url }}" alt="{{ product.title }}" class="w-full h-48 object-cover">
        <div class="p-4">
            <span class="text-xs font-semibold uppercase px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded">{{ product.category.name }}</span>
            <h3 class="font-bold text-lg mt-1 text-gray-900 truncate"><a href="{% url 'product_detail' product.pk %}">{{ product.title }}</a></h3>
            <p class="text-indigo-600 font-extrabold mt-1">₦{{ product.price }}</p>
            <p class="text-xs text-gray-500 mt-2">Location: {{ product.seller.hostel_location|default:"Campus" }}</p>
        </div>
    </div>
    {% empty %}
    <p class="col-span-full text-center text-gray-500 py-10">No items available at the moment.</p>
    {% endfor %}
</div>
{% endblock %}
